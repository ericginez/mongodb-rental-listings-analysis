[project]
name = "projet_07"
version = "0.1.0"
description = "Environnement Poetry pour le projet 07 (OC-DE)"
authors = [{name = "Eric Ginez",email = "eric.ginez@gmail.com"}]
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "pymongo (>=4.16.0,<5.0.0)",
    "polars (>=1.39.0,<2.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
